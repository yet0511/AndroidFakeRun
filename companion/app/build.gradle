plugins { id 'com.android.application' }

android {
    namespace 'com.androidfakerun.companion'
    compileSdk 35

    defaultConfig {
        applicationId 'com.androidfakerun.companion'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
