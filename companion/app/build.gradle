plugins { id 'com.android.application' }

android {
    namespace 'com.androidfakerun.companion'
    compileSdk 35

    defaultConfig {
        applicationId 'com.androidfakerun.companion'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    dependencies {
        // LSPosed/Xposed Hook API：官方 api-82（jcenter 已下线，此处随仓库 vendored），
        // 仅参与编译，不打进 APK（运行时由 LSPosed 框架提供实现）。
        compileOnly files('libs/XposedBridgeApi-82.jar')
    }
}
